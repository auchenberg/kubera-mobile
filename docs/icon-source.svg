<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Kubera Mobile app icon — "Ascent".
       Three ascending treads merged into one continuous mass, filleted at every
       corner (r=40). No mask, no shadow, no transparency: iOS applies its own
       corner mask, so the artwork is a full-bleed square.

       Geometry (1024 canvas): 3 treads 220 wide; heights 260 / 380 / 500 above a
       baseline at y=726, so every riser is 120 and the bottom tread is a solid
       260-tall plinth. Mark bbox x 147..807, y 226..726.

       Balance: an ascending form carries most of its ink at the right, so a
       centred bounding box reads bottom-right heavy. The box is therefore offset
       up and to the left until the mark's INK CENTROID sits at (523, 523) —
       three quarters of the way from the box centre to the canvas centre. Going
       the full distance overshoots and opens a hole at the bottom right.
       Resulting margins: left 147, right 217, top 226, bottom 298. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151B2E"/>
      <stop offset="1" stop-color="#0B0E1A"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#35C773"/>
      <stop offset="1" stop-color="#5FE694"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <path fill="url(#mark)" d="M187,726 A40 40 0 0 1 147,686 L147,506 A40 40 0 0 1 187,466
    L327,466 A40 40 0 0 0 367,426 L367,386 A40 40 0 0 1 407,346
    L547,346 A40 40 0 0 0 587,306 L587,266 A40 40 0 0 1 627,226
    L767,226 A40 40 0 0 1 807,266 L807,686 A40 40 0 0 1 767,726 Z"/>
</svg>
